name: crm_panel
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  crypto: ^3.0.7
  provider: ^6.1.5+1

  # Supabase
  supabase: ^2.13.4
  supabase_flutter: ^2.15.4

  # Navigation
  go_router: ^17.3.0

  # Images and media
  image: 4.3.0
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0

  # Utilities
  uuid: ^4.5.3
  intl: ^0.20.2
  http: ^1.6.0
  connectivity_plus: ^7.2.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  shamsi_date: ^1.1.1

  # Charts and UI
  fl_chart: ^1.2.0
  flutter_spinkit: ^5.2.2
  shimmer: ^3.0.0
  responsive_framework: ^1.5.1

  # File handling and PDF
  file_picker: ^11.0.2
  excel: ^4.0.6
  pdf: ^3.10.4
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
