
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Flutter project
        shell: bash
        run: |
          set -e
          if [ ! -f pubspec.yaml ]; then
            echo "::error::pubspec.yaml not found at repository root."
            echo "Check whether your Flutter project is inside a subfolder."
            find . -maxdepth 3 -name pubspec.yaml -print
            exit 1
          fi

          if [ ! -f android/settings.gradle ] && \
             [ ! -f android/settings.gradle.kts ]; then
            echo "::error::Android project files are missing."
            find . -maxdepth 4 \
              \( -name gradlew -o -name settings.gradle \
              -o -name settings.gradle.kts \) -print
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Supabase key
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add SUPABASE_PUBLISHABLE_KEY in GitHub Actions secrets."
            exit 1
          fi

      - name: Build release APK
        env:
          SUPABASE_URL: https://cfdzxtnkiptnlitwvnla.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${SUPABASE_URL}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}

      - name: Check APK
        if: success()
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 7
